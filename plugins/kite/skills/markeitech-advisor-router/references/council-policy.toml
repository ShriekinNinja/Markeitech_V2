schema_version = 3
policy_version = "2026-09-05-v4"
plugin_version = "0.1.0+codex.20260905195553"
router_skill = "markeitech-advisor-router"

# Allocation mappings live only here. Prior use is continuity evidence, not quality parity.
[allocation]
schema_version = 1

[allocation.models."gpt-5.6-sol"]
efforts = ["medium", "high", "xhigh"]
capabilities = ["source_analysis", "tool_use", "evidence_reporting"]
evidence = "council baseline policy-2026-08-29-v3; prior exact-role consultations; not a comparative quality evaluation"

[allocation.profiles.sol_medium]
model = "gpt-5.6-sol"
reasoning_effort = "medium"

[allocation.profiles.sol_high]
model = "gpt-5.6-sol"
reasoning_effort = "high"

[allocation.profiles.sol_xhigh]
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"

[allocation.constraints.standard]
profiles = ["sol_medium", "sol_high", "sol_xhigh"]
fork_modes = ["none", "bounded"]

[allocation.retries.single_attempt]
max_attempts = 1
max_fallbacks = 0
max_escalations = 0
fallback_profiles = []
escalation_profiles = []

[defaults]
kite_activation = "explicit_task_only"
fresh_session = "normal_codex"
continuation = "direct_kite_task_followups_only"
casual_mention = "does_not_activate"
filesystem = "read_only_consultation"
external_actions = "deny"
authenticated_sessions = "deny"
secrets = "deny"
mcp_servers = []
network = "deny"
direct_primary_invocation = "custom_role_or_explicit_user_only"
direct_specialist_invocation = "narrow_override_no_kite_mode"
failure = "stop_affected_conclusion"
selection = "smallest_sufficient_set"
ordering = "explicit_selected_role_dag"

