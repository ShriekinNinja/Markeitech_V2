route_mode = "MULTI"
expected_roles = ["markeitech_architecture_boundaries_advisor", "markeitech_event_driven_architecture_advisor"]
allowed_roles = []
edges = [["markeitech_architecture_boundaries_advisor", "markeitech_event_driven_architecture_advisor"]]
