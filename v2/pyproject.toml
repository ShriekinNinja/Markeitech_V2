[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markeitech-v2"
version = "0.1.0"
description = "Markeitech runtime on the NautilusTrader v2 Rust core."
requires-python = ">=3.13,<3.14"
dependencies = [
  "kaleido>=1.1,<2",
  "nautilus_trader==2.0.0rc3",
  "pandas-market-calendars>=5.4,<6",
  "plotly>=6.9,<7",
  "psutil>=7,<8",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
  "requests>=2.34,<3",
]

[project.scripts]
markeitech-system = "markeitech.system.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/markeitech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["postgres: requires a disposable PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
