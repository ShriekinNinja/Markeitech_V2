# V3 progressive-capability review baseline.
#
# ENABLED SURFACE:
# - one explicit instrument: ESU6.CME
# - one acquisition capability: watchlist_last
# - mandatory control, calendar, evidence-health, acquisition, and persistence infrastructure
#
# DISABLED SURFACE:
# - quote metrics, session measurements, rolling calculations, and entity analysis
# - Discord, telemetry, probes, and every visual-review component
#
# Values inside disabled sections are schema-required inert placeholders. They are not accepted
# analytical defaults and must be reviewed before their owning engine is enabled.
# Never place secrets in this file; local secrets belong in the ignored v2/.env.

schema_version = 17

[runtime]
name = "MARKEITECH-V3-ES-PROGRESSIVE-001"
trader_id = "MARKEITECH-001"
environment = "live"

[ib]
host = "127.0.0.1"
port = 4002
client_id = 20
symbology_method = "simplified"
convert_exchange_to_mic_venue = false
market_data_type = "realtime"
use_regular_trading_hours = false
batch_quotes = true
ignore_quote_tick_size_updates = false
handle_revised_bars = false
connection_timeout_seconds = 30
request_timeout_seconds = 30

# V3 TIMESTAMP BOUNDARY — BOUNDED CONNECTED PATH ACCEPTED:
# Installed Nautilus 2.0.0rc3 sends intraday historical bounds in UTC, but its pinned Rust ibapi
# 3.3.0 rejects IB's valid dashed UTC HistoricalDataEnd form. TWS/Gateway must temporarily send
# instrument-timezone attributes so that dependency can parse the response metadata; Nautilus and
# Markeitech still retain absolute Unix nanoseconds internally. Two connected ES runs then exposed
# a separate inclusive-to-exclusive end conversion defect (repeatable 4/5 bars). After the native
# port correction, one connected ES request returned exactly five consecutive one-minute closes,
# READY 5/5, no forming bar, no retry/late callback, and fully reconciled persistence. Acceptance is
# limited to that single recent-completed request path. Daily and coarser provider bars remain
# date-semantic and are not accepted as exchange-session boundary truth.

[logging]
directory = "../data/logs"
file_name = "markeitech-v3-es-progressive.log"

# V3 REVIEW DEBT — NOT ACCEPTED:
# Only directory and file_name are configuration-owned. The node builder currently hardcodes
# stdout/file levels to INFO, append behavior (clear_log_file = false), and synchronous flush.
# Review whether those native logging controls require typed TOML fields before this process is
# accepted; do not treat the hardcoded values as approved defaults merely because this config loads.

[discord]
enabled = false
request_timeout_seconds = 5
queue_capacity = 32
ping_critical_resource_alerts = true

