# V3 REVIEW DEBT — CURRENT VALUES RETAINED FOR THE FIRST HEALTHY SANITY RUN:
# - Retry and shutdown budgets are not mutually bounded: three 5s connection attempts plus two
#   100ms backoffs can exceed the 10s worker shutdown wait before SQL/commit time is included.
# - CLI STOPPED closure is not gated by an actor-to-CLI acknowledgement that the persistence
#   worker terminated, STOPPING was stored, and accepted/stored/failed/rejected/pending reconciled.
# - Startup schema verification checks required table and column names, not exact types,
#   nullability, defaults, constraints, indexes, ownership, or privileges.
# - System-health duplicate suppression does not compare stored content for a conflicting
#   (run_id, sequence), unlike generic operational-event identity collision handling.
# - Every write exception receives the same whole-batch retry policy; transient, permanent, and
#   ambiguous-commit failures are not classified separately.
# - The pending-write queue is bounded, but the worker result queue is unbounded.
# - PostgreSQL volume durability is not backup/restore acceptance; no reviewed recovery objective
#   or restore drill is established.
# These debts do not authorize a no-database mode, raw market-data retention, native persistence,
# or a policy change. Any retry, failure, rejection, pending write, worker timeout, sequence gap,
# or unreconciled STOPPED run rejects persistence acceptance for this first connected run.
[persistence]
dsn_env = "MARKEITECH_POSTGRES_DSN"
connect_timeout_seconds = 5
queue_capacity = 512
critical_queue_reserve = 32
write_batch_size = 64
result_poll_interval_ms = 250
shutdown_timeout_seconds = 10
write_max_attempts = 3
write_retry_backoff_ms = 100

# V3 REMOVAL / TEST-TOOL RELOCATION CANDIDATE — NOT YET AUTHORIZED FOR DELETION:
# The native-consumer probe is a completed multi-consumer diagnostic, not the acquisition owner.
# It accepts quote/trade feeds only, while this profile supplies a bar feed; enabling it here would
# fail actor construction and the loader does not detect that incompatibility. Keep it disabled.
# Preserve its historical proof and tests before removing it from the production configuration.
[acquisition]
native_consumer_probe_enabled = false
native_consumer_probe_unsubscribe_after_seconds = 15

# V3 REVIEW DEBT — HISTORICAL PROVIDER ACQUISITION IS DISABLED AFTER CALIBRATION:
# - The 2026-08-27 ES sanity run published global READY after instrument-definition and
#   persistence readiness but before the bar stream became ACTIVE or produced its first live
#   observation. READY is therefore control-plane startup readiness, not proof of usable live
#   market evidence; future acceptance must inspect the acquisition/evidence lifecycle until a
#   separate live-evidence readiness contract is reviewed.
# - The same sanity run produced duplicate startup acquisition-status publications. They were
#   detected and caused no duplicate provider subscription, but add avoidable lifecycle/audit noise
#   and should be reconciled at the acquisition owner rather than normalized by projections.
# - The mandatory acquisition actor still constructs historical machinery and advances an empty
#   coordinator every 100ms even when no historical-demand producer is composed.
# - maximum_plan_requests and maximum_total_observations are checked per independently compiled
#   demand, not as aggregate outstanding/session/run budgets across all consumers.
# - There is no explicit successful-request pacing interval; retry_backoff_ms is not IB pacing.
# - Provider errors are not classified by entitlement, pacing, unavailable range, farm/session,
#   permanent request defect, timeout, or adapter/local failure before retry policy is applied.
# - Some planning/capacity/deferred/shutdown rejections do not publish one typed terminal result to
#   the consumer; log-only rejection can leave demand lifecycle and audit incomplete.
# - Historical producers use one-shot startup publication without a receipt acknowledgement or
#   stable-demand reconciliation contract.
# - Native historical cancellation is a no-op at this boundary. A late response can be attributed
#   to a newer attempt or another active request because the callback exposes no request identity.
# - Sequential shutdown cancellation can dispatch pending work after stopping has begun.
# - Scheduling is priority then request identity, not FIFO, and has no aging/fairness contract.
# - A next request can be submitted before the prior batch/readiness outcome is published.
# - Live provider-subscription failure has no autonomous acquisition-owner retry; any FAILED
#   transition rejects this first run rather than being awaited as self-recovering.
# - No typed deadline currently bounds SUBSCRIBED to first matching bar/ACTIVE for this profile.
# - Nautilus RC3's pinned Rust ibapi 3.3.0 rejects IB's dashed UTC HistoricalDataEnd metadata, so
#   instrument-timezone transport is required until the dependency accepts both official forms.
# - Nautilus turns that native parse failure into an empty response; Markeitech then records an
#   accepted/completed zero-observation result before correctly degrading consumer readiness.
# - Two instrument-timezone calibration runs returned a repeatable 4/5 because the prior native
#   port submitted the inclusive `...:59.999999999` end at whole-second `...:59` instead of the
#   completed exclusive minute boundary. The corrected port is connected-accepted for one exact
#   five-bar ES recent-completed path; other selectors/windows remain unaccepted.
# The values below authorize one 55-minute request for the one-hour visual review. They are not IB
# limits or accepted analytical-history policy; a short response or timeout must fail honestly and
# must not trigger request splitting or an automatic second request.
[historical]
maximum_plan_requests = 1
maximum_observations_per_request = 55
maximum_total_observations = 55
maximum_outstanding_requests = 1
maximum_in_flight_requests = 1
timeout_seconds = 30
maximum_attempts = 1
retry_backoff_ms = 500
poll_interval_ms = 100

# V3 REMOVAL / TEST-TOOL RELOCATION CANDIDATE — NOT YET AUTHORIZED FOR DELETION:
# This two-consumer one-minute-history probe is a completed Stage 9B acceptance harness, not an
# analytical warmup definition. V3 used one probe consumer for exactly one five-bar historical
# calibration and returned it to disabled after READY 5/5. The result does not accept the probe as a
# production capability or close value-level historical/live parity. Future history must be
# declared by the exact reviewed analytical capability; preserve deterministic tests and historical
# evidence before removing the probe from the production configuration.
[historical.probe]
enabled = false
actor_ids = ["HISTORICAL-PROBE-A"]
instrument_id = "ESU6.CME"
selector = "1-MINUTE-LAST-EXTERNAL"
window = "recent_completed"
minimum_observations = 5
maximum_observations = 5
priority = 10

# SessionStateActor is mandatory infrastructure in the current topology. This calendar enables
# time identity and does not enable optional session measurements or analytical windows. All
# resulting boundaries are absolute UTC nanoseconds; timezone below is civil-rule/trade-date
# provenance, not an alternate internal timestamp format.
# V3 REVIEW DEBT — NOT ACCEPTED AS FINAL ANALYTICAL SESSION POLICY:
# - schedule_version is published metadata but startup does not verify it against the installed
#   pandas-market-calendars package or calendar definition.
# - Empty phases intentionally yield one broad provider OPEN envelope. The implementation ignores
#   provider break_start/break_end, so CME's 15:15-15:30 America/Chicago break remains OPEN and can
#   produce a false evidence-health deterioration if a run crosses it.
# - Explicit analytical phases must later declare whether their wall-clock authority is native CME
#   America/Chicago or an intentionally separate clock such as the New York cash-session open.
