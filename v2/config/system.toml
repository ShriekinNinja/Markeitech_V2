schema_version = 2

[runtime]
name = "MARKEITECH-V2-PAPER-001"
trader_id = "MARKEITECH-001"
environment = "live"

[ib]
host = "127.0.0.1"
port = 4002
client_id = 20
symbology_method = "simplified"
convert_exchange_to_mic_venue = false
market_data_type = "realtime"
use_regular_trading_hours = false
batch_quotes = true
ignore_quote_tick_size_updates = false
handle_revised_bars = false
connection_timeout_seconds = 30
request_timeout_seconds = 30

[logging]
directory = "../data/logs"
file_name = "markeitech-v2.log"

[discord]
enabled = true
request_timeout_seconds = 5

[persistence]
dsn_env = "MARKEITECH_POSTGRES_DSN"
connect_timeout_seconds = 5
queue_capacity = 64
result_poll_interval_ms = 250
shutdown_timeout_seconds = 10
write_max_attempts = 3
write_retry_backoff_ms = 100

[acquisition]
bootstrap_feeds = [
  { instrument_id = "ESU6.CME", kind = "quotes", selector = "default" },
  { instrument_id = "ESU6.CME", kind = "trades", selector = "default" },
  { instrument_id = "SPY.ARCA", kind = "quotes", selector = "default" },
  { instrument_id = "SPY.ARCA", kind = "trades", selector = "default" },
]

[[instruments]]
id = "ESU6.CME"

[[instruments]]
id = "SPY.ARCA"
