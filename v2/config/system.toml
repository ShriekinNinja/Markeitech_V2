schema_version = 8

[runtime]
name = "MARKEITECH-V2-PAPER-001"
trader_id = "MARKEITECH-001"
environment = "live"

[ib]
host = "127.0.0.1"
port = 4002
client_id = 20
symbology_method = "simplified"
convert_exchange_to_mic_venue = false
market_data_type = "realtime"
use_regular_trading_hours = false
batch_quotes = true
ignore_quote_tick_size_updates = false
handle_revised_bars = false
connection_timeout_seconds = 30
request_timeout_seconds = 30

[logging]
directory = "../data/logs"
file_name = "markeitech-v2.log"

[discord]
enabled = true
request_timeout_seconds = 5

[persistence]
dsn_env = "MARKEITECH_POSTGRES_DSN"
connect_timeout_seconds = 5
queue_capacity = 512
critical_queue_reserve = 32
write_batch_size = 64
result_poll_interval_ms = 250
shutdown_timeout_seconds = 10
write_max_attempts = 3
write_retry_backoff_ms = 100

[acquisition]
native_consumer_probe_enabled = false
native_consumer_probe_unsubscribe_after_seconds = 15

[historical]
maximum_plan_requests = 64
maximum_observations_per_request = 5000
maximum_total_observations = 20000
maximum_outstanding_requests = 64
maximum_in_flight_requests = 1
timeout_seconds = 30
maximum_attempts = 3
retry_backoff_ms = 500
poll_interval_ms = 100

[historical.probe]
enabled = true
instrument_id = "ESU6.CME"
selector = "1-MINUTE-LAST-EXTERNAL"
window = "recent_completed"
minimum_observations = 5
maximum_observations = 10
priority = 10

[sessions]
evaluation_interval_ms = 1000

