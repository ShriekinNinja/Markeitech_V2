services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: markeitech
      POSTGRES_USER: markeitech
      POSTGRES_PASSWORD: ${MARKEITECH_POSTGRES_PASSWORD:?set in v2/.env}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markeitech -d markeitech"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - markeitech-postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  markeitech-postgres:
