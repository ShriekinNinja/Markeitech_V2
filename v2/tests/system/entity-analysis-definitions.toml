[[metrics.entity_analysis.definitions]]
definition_id = "volatility-state-v1"
group = "volatility_compression_expansion"
entity_type = "volatility_state"
entity_version = 1
enabled = true
decision_question = "What is the current numerical volatility state for this horizon?"
implementation_id = "markeitech.entity.volatility_state.v1"
formula_version = 1
identity_dimensions = ["horizon", "definition_id"]
durability = "TRANSIENT"
completion_rule = "never completes while the horizon is active"
invalidation_rule = "dependency identity conflict"
expiry_rule = "configured maximum input age"
permitted_health = ["READY", "DEGRADED", "WARMING", "STALE", "UNAVAILABLE"]
permitted_fidelities = ["DERIVED", "PARTIAL"]
applications = [{ application_id = "cme-fast", analytical_profile_ids = ["cme_equity_primary"], instrument_ids = [], instrument_classes = ["future"], session_phases = ["OPEN"], horizon = "fast", source_selector = "1-MINUTE-LAST-EXTERNAL", requires_volume = false }]
metric_inputs = [
  { role = "normalized_volatility", metric_id = "rolling.fast.context_45m.range_percentile_recent", metric_version = 1, parameter_version = 1, required = true, permitted_health = ["READY", "DEGRADED", "WARMING"], permitted_fidelities = ["DERIVED", "PARTIAL"] },
  { role = "coverage_ratio", metric_id = "rolling.fast.context_45m.coverage_ratio", metric_version = 1, parameter_version = 1, required = true, permitted_health = ["READY", "DEGRADED", "WARMING"], permitted_fidelities = ["DERIVED", "PARTIAL"] },
  { role = "average_true_range", metric_id = "rolling.fast.context_45m.average_true_range", metric_version = 1, parameter_version = 1, required = false, permitted_health = ["READY", "DEGRADED", "WARMING"], permitted_fidelities = ["DERIVED", "PARTIAL"] },
  { role = "realized_range", metric_id = "rolling.fast.context_45m.price_range", metric_version = 1, parameter_version = 1, required = false, permitted_health = ["READY", "DEGRADED", "WARMING"], permitted_fidelities = ["DERIVED", "PARTIAL"] },
  { role = "realized_return_magnitude", metric_id = "rolling.fast.context_45m.realized_log_return_magnitude", metric_version = 1, parameter_version = 1, required = false, permitted_health = ["READY", "DEGRADED", "WARMING"], permitted_fidelities = ["DERIVED", "PARTIAL"] },
]
entity_inputs = []
parameters = [
  { parameter_id = "volatility_low_upper", meaning = "Upper recent-range percentile boundary for low volatility", value_kind = "number", unit = "ratio", default = 0.25, dynamic = true, mutability = "policy_controlled_runtime", source = "offline-test-fixture", minimum = 0.05, maximum = 0.45, step = 0.05 },
  { parameter_id = "volatility_typical_upper", meaning = "Upper recent-range percentile boundary for typical volatility", value_kind = "number", unit = "ratio", default = 0.75, dynamic = true, mutability = "policy_controlled_runtime", source = "offline-test-fixture", minimum = 0.55, maximum = 0.95, step = 0.05 },
  { parameter_id = "volatility_hysteresis", meaning = "Additional percentile movement required before category transition", value_kind = "number", unit = "ratio", default = 0.05, dynamic = true, mutability = "policy_controlled_runtime", source = "offline-test-fixture", minimum = 0.0, maximum = 0.20, step = 0.01 },
  { parameter_id = "volatility_confirmation_observations", meaning = "Consecutive accepted observations required to confirm a category", value_kind = "integer", unit = "observations", default = 2, dynamic = true, mutability = "policy_controlled_runtime", source = "offline-test-fixture", minimum = 1, maximum = 10, step = 1 },
  { parameter_id = "volatility_minimum_coverage_ratio", meaning = "Minimum rolling-window coverage eligible for classification", value_kind = "number", unit = "ratio", default = 0.8, dynamic = true, mutability = "policy_controlled_runtime", source = "offline-test-fixture", minimum = 0.5, maximum = 1.0, step = 0.05 },
  { parameter_id = "volatility_maximum_evidence_age_ms", meaning = "Maximum accepted age for volatility evidence", value_kind = "integer", unit = "milliseconds", default = 120000, dynamic = true, mutability = "policy_controlled_runtime", source = "offline-test-fixture", minimum = 5000, maximum = 600000, step = 5000 },
]
parameter_sets = [{ parameter_set_id = "volatility-percentile-fixture", parameter_version = 1, effective_from = "2026-08-23T00:00:00Z", source = "offline-test-fixture", values = { volatility_low_upper = 0.25, volatility_typical_upper = 0.75, volatility_hysteresis = 0.05, volatility_confirmation_observations = 2, volatility_minimum_coverage_ratio = 0.8, volatility_maximum_evidence_age_ms = 120000 } }]
market_state = { parameter_set_id = "volatility-percentile-fixture", normalization = "recent_range_percentile", policies = [{ axis = "primary", policy_id = "volatility-percentile-primary", policy_version = 1, measure_role = "normalized_volatility", coverage_role = "coverage_ratio", unavailable_category = "UNAVAILABLE", bands = [{ category = "LOW", upper_bound_parameter_id = "volatility_low_upper" }, { category = "TYPICAL", lower_bound_parameter_id = "volatility_low_upper", upper_bound_parameter_id = "volatility_typical_upper" }, { category = "HIGH", lower_bound_parameter_id = "volatility_typical_upper" }], hysteresis_parameter_id = "volatility_hysteresis", confirmation_observations_parameter_id = "volatility_confirmation_observations", minimum_coverage_ratio_parameter_id = "volatility_minimum_coverage_ratio", maximum_evidence_age_ms_parameter_id = "volatility_maximum_evidence_age_ms", permitted_health = ["READY", "DEGRADED"], permitted_fidelities = ["DERIVED", "PARTIAL"] }] }

