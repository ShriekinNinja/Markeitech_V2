[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markeitech"
version = "0.1.0"
description = "Market analysis, research, replay, dashboard, and later live trading platform."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi[standard]>=0.115",
  "nautilus_trader[ib,docker]",
  "pandas-market-calendars==5.4.0",
  "pydantic>=2.8",
  "pyarrow>=16",
  "redis>=5",
  "plotly>=6.9.0",
]

[project.scripts]
markeitech-api = "markeitech.api:main"
markeitech-market-data-plan = "markeitech.market_data.cli:main"
markeitech-market-data-smoke = "markeitech.market_data.smoke:main"
markeitech-market-data-acceptance = "markeitech.market_data.acceptance:main"
markeitech-analytics-chart = "markeitech.analytics.chart_cli:main"
markeitech-sqlite-compact = "markeitech.persistence.compact:main"

[dependency-groups]
dev = [
  "black>=24.8",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/markeitech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py313"]
