# Tracked V2 starting template. Copy this file to system.local.toml before a connected run.
# Review IB port/client identity, explicit futures contracts, entitlements, calendars, and policy.
# Never place secrets in this file; local secrets belong in the ignored .env.

schema_version = 27

[runtime]
name = "MARKEITECH-V2-001"
trader_id = "MARKEITECH-001"
environment = "live"

[ib]
host = "127.0.0.1"
port = 4002
client_id = 20
symbology_method = "simplified"
convert_exchange_to_mic_venue = false
market_data_type = "realtime"
use_regular_trading_hours = false
batch_quotes = true
ignore_quote_tick_size_updates = false
handle_revised_bars = false
connection_timeout_seconds = 30
request_timeout_seconds = 30

[ib_execution]
# Optional native execution-client connection; uses the shared [ib] endpoint/provider settings.
enabled = false
client_id = 42
account_id = "" # Set an explicit account in your ignored local config before enabling.

[risk_engine]
bypass = false

[logging]
directory = "../data/logs"
file_name = "markeitech-v2.log"

[discord]
enabled = true
request_timeout_seconds = 5
queue_capacity = 32
ping_critical_resource_alerts = true


# Local browser dashboard. All settings are startup-only; restart to apply changes.
# Policy version identifies this bounded display contract; no raw data is persisted.
[dashboard]
policy_version = 1 # Only 1 is supported.
enabled = true # Set true to start/stop the dashboard with the system.
port = 8765 # TCP port, 1024..65535; binds to 127.0.0.1 only.
maximum_instruments = 64 # 1..256; must cover every enabled watchlist member.
candles_per_instrument = 720 # 2..5000 completed 5s bars, held in memory per member.
publish_interval_ms = 250 # 100..5000 ms; browser projection cadence, not data cadence.
acquisition_retry_interval_ms = 1000 # 100..10000 ms; membership/attachment retry cadence.
maximum_clients = 4 # 1..16 concurrent browser SSE streams.
shutdown_timeout_seconds = 5 # 1..30 seconds to drain/close the web-server worker.

[runtime_resources]
enabled = true
sample_interval_ms = 10000
log_every_samples = 1
include_cache_counts = true
disk_path = "/"

[runtime_resources.health]
enabled = true
threshold_version = "2026-08-22-v2"
warning_consecutive_samples = 6
critical_consecutive_samples = 3
recovery_consecutive_samples = 6
notification_cooldown_ms = 900000
rss_growth_window_samples = 90
stale_warning_ms = 30000
stale_critical_ms = 120000

[runtime_resources.health.warning]
host_memory_available_percent = 15.0
host_cpu_percent = 90.0
host_swap_percent = 50.0
disk_free_bytes = 16106127360
disk_free_percent = 10.0
process_rss_bytes = 4294967296
process_rss_growth_bytes = 536870912
process_cpu_percent = 400.0
thread_count = 100
open_fd_ratio = 0.70

[runtime_resources.health.critical]
host_memory_available_percent = 8.0
host_cpu_percent = 98.0
host_swap_percent = 80.0
disk_free_bytes = 5368709120
disk_free_percent = 2.0
process_rss_bytes = 8589934592
process_rss_growth_bytes = 1073741824
process_cpu_percent = 800.0
thread_count = 250
open_fd_ratio = 0.90

[persistence]
dsn_env = "MARKEITECH_POSTGRES_DSN"
connect_timeout_seconds = 5
queue_capacity = 512
critical_queue_reserve = 32
write_batch_size = 64
result_poll_interval_ms = 250
shutdown_timeout_seconds = 10
write_max_attempts = 3
write_retry_backoff_ms = 100

[historical]
maximum_plan_requests = 64
maximum_observations_per_request = 5000
maximum_total_observations = 20000
maximum_outstanding_requests = 64
maximum_in_flight_requests = 1
timeout_seconds = 30
maximum_attempts = 3
retry_backoff_ms = 500
poll_interval_ms = 100

[sessions]
evaluation_interval_ms = 1000
projection_lookback_days = 120
projection_lookahead_days = 14
maximum_projection_days = 400
maximum_calendars_per_request = 8
calendar_catalog = "market-calendars.toml"
calendar_ids = ["cboe_spxw", "us_equities", "cme_equity", "cbot_equity", "cme_energy"]

[sessions.projection_retry]
response_timeout_ms = 5000
maximum_attempts = 3
retry_backoff_ms = 1000
maximum_elapsed_ms = 60000

[sessions.current_state_delivery]
policy_version = 1
response_timeout_ms = 5000
maximum_attempts = 3
retry_backoff_ms = 1000
maximum_elapsed_ms = 60000
maximum_buffered_transitions_per_calendar = 8
maximum_total_buffered_transitions = 32
boundary_delivery_grace_ms = 2000

[evidence_health]
evaluation_interval_ms = 1000
consumer_retry_interval_ms = 1000
provider_id = "IB"
profile_checkpoint_samples = 25

[[evidence_health.policies]]
feed_kind = "quotes"
selector = "default"
fresh_for_ms = 5000
stale_after_ms = 15000
unavailable_after_ms = 60000
adaptive = true
minimum_samples = 20
decay_factor = 0.95
fresh_stddev_multiplier = 2.0
stale_stddev_multiplier = 4.0
unavailable_stddev_multiplier = 8.0
min_fresh_ms = 2000
max_fresh_ms = 15000
min_stale_ms = 5000
max_stale_ms = 45000
min_unavailable_ms = 15000
max_unavailable_ms = 120000

[[evidence_health.policies]]
feed_kind = "bars"
selector = "5-SECOND-LAST-EXTERNAL"
fresh_for_ms = 7000
stale_after_ms = 15000
unavailable_after_ms = 30000
adaptive = false
minimum_samples = 20
decay_factor = 0.95
fresh_stddev_multiplier = 2.0
stale_stddev_multiplier = 4.0
unavailable_stddev_multiplier = 8.0
min_fresh_ms = 5000
max_fresh_ms = 10000
min_stale_ms = 10000
max_stale_ms = 20000
min_unavailable_ms = 20000
max_unavailable_ms = 60000

[watchlist]
enabled = true
consumer_retry_interval_ms = 1000

[[watchlist.members]]
instrument_id = "ESU6.CME"
calendar_id = "cme_equity"
owner_ids = ["config:system"]
capabilities = ["top_of_book", "watchlist_last"]

[[watchlist.members]]
instrument_id = "NQU6.CME"
calendar_id = "cme_equity"
owner_ids = ["config:system"]
capabilities = ["top_of_book", "watchlist_last"]

[[watchlist.members]]
instrument_id = "CLV6.NYMEX"
calendar_id = "cme_energy"
owner_ids = ["config:system"]
capabilities = ["top_of_book", "watchlist_last"]

[[watchlist.members]]
instrument_id = "SPY.ARCA"
calendar_id = "us_equities"
owner_ids = ["config:system"]
capabilities = ["top_of_book", "watchlist_last"]

[[watchlist.members]]
instrument_id = "QQQ.NASDAQ"
calendar_id = "us_equities"
owner_ids = ["config:system"]
capabilities = ["top_of_book", "watchlist_last"]

[[watchlist.members]]
instrument_id = "^SPX.CBOE"
calendar_id = "us_equities"
owner_ids = ["config:system"]
capabilities = ["watchlist_last"]

[[watchlist.members]]
instrument_id = "^VIX.CBOE"
calendar_id = "us_equities"
owner_ids = ["config:system"]
capabilities = ["watchlist_last"]
