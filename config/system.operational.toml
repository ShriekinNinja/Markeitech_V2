# Connected operational boot: nine operational actors, no watchlist or instruments.
# Bootstrap settings come first; active actor settings follow composition/startup order.
# TOML order is for reading only; it does not control startup or guarantee readiness order.
# INACTIVE marks disabled capabilities; IDLE marks settings with no work in this empty profile.
# Customize host/port/client ID and resource thresholds in an ignored local copy.
# Live acceptance belongs to Markeitect; this profile does not prove connectivity or data fitness.
schema_version = 25

# BOOTSTRAP: node and SystemControlActor identity (actor 1 has no separate settings).
[runtime]
name = "MARKEITECH-OPERATIONAL-001"
trader_id = "MARKEITECH-001"
environment = "live"

# BOOTSTRAP: native node logging.
[logging]
directory = "../data/logs"
file_name = "markeitech-operational.log"

# BOOTSTRAP: IB data-client connection.
# IDLE: market-data subscription and bar options have no instrument work in this profile.
[ib]
host = "127.0.0.1"
port = 4002
client_id = 20
symbology_method = "simplified"
convert_exchange_to_mic_venue = false
market_data_type = "realtime"
use_regular_trading_hours = false
batch_quotes = true
ignore_quote_tick_size_updates = false
handle_revised_bars = false
connection_timeout_seconds = 30
request_timeout_seconds = 30

# ACTOR 2: SessionStateActor - canonical calendar state and current-state delivery.
[sessions]
evaluation_interval_ms = 1000
projection_lookback_days = 120
projection_lookahead_days = 14
maximum_projection_days = 400
maximum_calendars_per_request = 8
calendar_catalog = "market-calendars.toml"
calendar_ids = ["cme_equity"]

# IDLE: projection-request retries are unused until a consumer needs calendar projections.
[sessions.projection_retry]
response_timeout_ms = 5000
maximum_attempts = 3
retry_backoff_ms = 1000
maximum_elapsed_ms = 60000

# ACTIVE: snapshot/reconciliation delivery used by operational calendar consumers at startup.
[sessions.current_state_delivery]
policy_version = 1
response_timeout_ms = 5000
maximum_attempts = 3
retry_backoff_ms = 1000
maximum_elapsed_ms = 60000
maximum_buffered_transitions_per_calendar = 8
maximum_total_buffered_transitions = 32
boundary_delivery_grace_ms = 2000

# ACTOR 3: EvidenceHealthActor - calendar synchronization remains active.
# IDLE: feed evaluation and recency checkpoints have no configured instruments.
[evidence_health]
evaluation_interval_ms = 1000
consumer_retry_interval_ms = 1000
provider_id = "IB"
profile_checkpoint_samples = 25

# INACTIVE: retained bar-health policy; no bar feeds exist in the empty watchlist.
# Adaptive settings below are also disabled by adaptive = false.
[[evidence_health.policies]]
feed_kind = "bars"
selector = "5-SECOND-LAST-EXTERNAL"
fresh_for_ms = 7000
stale_after_ms = 15000
unavailable_after_ms = 30000
adaptive = false
minimum_samples = 20
decay_factor = 0.95
fresh_stddev_multiplier = 2.0
stale_stddev_multiplier = 4.0
unavailable_stddev_multiplier = 8.0
min_fresh_ms = 5000
max_fresh_ms = 10000
min_stale_ms = 10000
max_stale_ms = 20000
min_unavailable_ms = 20000
max_unavailable_ms = 60000

# ACTOR 4: DiscordHealthActor - outbound operational and health webhooks.
[discord]
enabled = true
request_timeout_seconds = 5
queue_capacity = 32
# INACTIVE: critical resource alerts do not ping Discord mentions.
ping_critical_resource_alerts = false

# ACTORS 5-6: HistoricalEvidencePlannerActor and DataAcquisitionActor.
# IDLE: request limits are retained, but no history or instrument requests run with zero demand.
[historical]
maximum_plan_requests = 1
maximum_observations_per_request = 60
maximum_total_observations = 60
maximum_outstanding_requests = 1
maximum_in_flight_requests = 1
timeout_seconds = 30
maximum_attempts = 1
retry_backoff_ms = 500
poll_interval_ms = 100

# ACTOR 7: RuntimeResourceActor - process, host, disk, and cache measurements.
[runtime_resources]
enabled = true
sample_interval_ms = 10000
log_every_samples = 1
include_cache_counts = true
disk_path = "/"

# ACTOR 8: RuntimeResourceHealthActor - resource thresholds, recovery, and telemetry staleness.
[runtime_resources.health]
enabled = true
threshold_version = "operational-boot-v1"
warning_consecutive_samples = 6
critical_consecutive_samples = 3
recovery_consecutive_samples = 6
notification_cooldown_ms = 900000
rss_growth_window_samples = 90
stale_warning_ms = 30000
stale_critical_ms = 120000

# ACTIVE: warning thresholds evaluated by RuntimeResourceHealthActor.
[runtime_resources.health.warning]
host_memory_available_percent = 15.0
host_cpu_percent = 90.0
host_swap_percent = 50.0
disk_free_bytes = 16106127360
disk_free_percent = 10.0
process_rss_bytes = 4294967296
process_rss_growth_bytes = 536870912
process_cpu_percent = 400.0
thread_count = 100
open_fd_ratio = 0.70

# ACTIVE: critical thresholds evaluated by RuntimeResourceHealthActor.
[runtime_resources.health.critical]
host_memory_available_percent = 8.0
host_cpu_percent = 98.0
host_swap_percent = 80.0
disk_free_bytes = 5368709120
disk_free_percent = 2.0
process_rss_bytes = 8589934592
process_rss_growth_bytes = 1073741824
process_cpu_percent = 800.0
thread_count = 250
open_fd_ratio = 0.90

# ACTOR 9: OperationalPersistenceActor - bounded operational audit delivery.
# Its database is also initialized by the CLI before node construction.
[persistence]
dsn_env = "MARKEITECH_POSTGRES_DSN"
connect_timeout_seconds = 5
queue_capacity = 512
critical_queue_reserve = 32
write_batch_size = 64
result_poll_interval_ms = 250
shutdown_timeout_seconds = 10
write_max_attempts = 3
write_retry_backoff_ms = 100

[watchlist]
enabled = false
consumer_retry_interval_ms = 1000
members = []
