# V3 progressive-capability review baseline.
#
# ENABLED SURFACE:
# - one explicit instrument: ESU6.CME
# - one acquisition capability: watchlist_last
# - mandatory control, calendar, evidence-health, historical-planning, acquisition, and persistence
#   infrastructure
#
# DISABLED SURFACE:
# - Discord, runtime-resource telemetry, broker observation, and Sir Loke
#
# Review disabled capabilities and their settings before enabling them.
# Never place secrets in this file; local secrets belong in the ignored .env.

schema_version = 25

[runtime]
name = "MARKEITECH-V3-ES-PROGRESSIVE-001"
trader_id = "MARKEITECH-001"
environment = "live"

[ib]
host = "127.0.0.1"
port = 4002
client_id = 20
symbology_method = "simplified"
convert_exchange_to_mic_venue = false
market_data_type = "realtime"
use_regular_trading_hours = false
batch_quotes = true
ignore_quote_tick_size_updates = false
handle_revised_bars = false
connection_timeout_seconds = 30
request_timeout_seconds = 30

# V3 TIMESTAMP BOUNDARY — BOUNDED CONNECTED PATH ACCEPTED:
# Installed Nautilus 2.0.0rc3 sends intraday historical bounds in UTC, but its pinned Rust ibapi
# 3.3.0 rejects IB's valid dashed UTC HistoricalDataEnd form. TWS/Gateway must temporarily send
# instrument-timezone attributes so that dependency can parse the response metadata; Nautilus and
# Markeitech still retain absolute Unix nanoseconds internally. Two connected ES runs then exposed
# a separate inclusive-to-exclusive end conversion defect (repeatable 4/5 bars). After the native
# port correction, one connected ES request returned exactly five consecutive one-minute closes,
# READY 5/5, no forming bar, no retry/late callback, and fully reconciled persistence. Acceptance is
# limited to that single recent-completed request path. Daily and coarser provider bars remain
# date-semantic and are not accepted as exchange-session boundary truth.

[logging]
directory = "../data/logs"
file_name = "markeitech-v3-es-progressive.log"

# V3 REVIEW DEBT — NOT ACCEPTED:
# Only directory and file_name are configuration-owned. The node builder currently hardcodes
# stdout/file levels to INFO, append behavior (clear_log_file = false), and synchronous flush.
# Review whether those native logging controls require typed TOML fields before this process is
# accepted; do not treat the hardcoded values as approved defaults merely because this config loads.

[discord]
enabled = false
request_timeout_seconds = 5
queue_capacity = 32
ping_critical_resource_alerts = true

[runtime_resources]
enabled = false
sample_interval_ms = 10000
log_every_samples = 1
include_cache_counts = true
disk_path = "/"

[runtime_resources.health]
enabled = false
threshold_version = "v3-disabled-placeholder"
warning_consecutive_samples = 6
critical_consecutive_samples = 3
recovery_consecutive_samples = 6
notification_cooldown_ms = 900000
rss_growth_window_samples = 90
stale_warning_ms = 30000
stale_critical_ms = 120000

[runtime_resources.health.warning]
host_memory_available_percent = 15.0
host_cpu_percent = 90.0
host_swap_percent = 50.0
disk_free_bytes = 16106127360
disk_free_percent = 10.0
process_rss_bytes = 4294967296
process_rss_growth_bytes = 536870912
process_cpu_percent = 400.0
thread_count = 100
open_fd_ratio = 0.70

[runtime_resources.health.critical]
host_memory_available_percent = 8.0
host_cpu_percent = 98.0
host_swap_percent = 80.0
disk_free_bytes = 5368709120
disk_free_percent = 2.0
process_rss_bytes = 8589934592
process_rss_growth_bytes = 1073741824
process_cpu_percent = 800.0
thread_count = 250
open_fd_ratio = 0.90

# V3 REVIEW DEBT — CURRENT VALUES RETAINED FOR THE FIRST HEALTHY SANITY RUN:
# - Retry and shutdown budgets are not mutually bounded: three 5s connection attempts plus two
#   100ms backoffs can exceed the 10s worker shutdown wait before SQL/commit time is included.
# - CLI STOPPED closure is not gated by an actor-to-CLI acknowledgement that the persistence
#   worker terminated, STOPPING was stored, and accepted/stored/failed/rejected/pending reconciled.
# - Startup schema verification checks required table and column names, not exact types,
#   nullability, defaults, constraints, indexes, ownership, or privileges.
# - System-health duplicate suppression does not compare stored content for a conflicting
#   (run_id, sequence), unlike generic operational-event identity collision handling.
# - Every write exception receives the same whole-batch retry policy; transient, permanent, and
#   ambiguous-commit failures are not classified separately.
# - The pending-write queue is bounded, but the worker result queue is unbounded.
# - PostgreSQL volume durability is not backup/restore acceptance; no reviewed recovery objective
#   or restore drill is established.
# These debts do not authorize a no-database mode, raw market-data retention, native persistence,
# or a policy change. Any retry, failure, rejection, pending write, worker timeout, sequence gap,
# or unreconciled STOPPED run rejects persistence acceptance for this first connected run.
[persistence]
dsn_env = "MARKEITECH_POSTGRES_DSN"
connect_timeout_seconds = 5
queue_capacity = 512
critical_queue_reserve = 32
write_batch_size = 64
result_poll_interval_ms = 250
shutdown_timeout_seconds = 10
write_max_attempts = 3
write_retry_backoff_ms = 100

# V3 REVIEW DEBT — HISTORICAL PROVIDER ACQUISITION IS DISABLED AFTER CALIBRATION:
# - The 2026-08-27 ES sanity run published global READY after instrument-definition and
#   persistence readiness but before the bar stream became ACTIVE or produced its first live
#   observation. READY is therefore control-plane startup readiness, not proof of usable live
#   market evidence; future acceptance must inspect the acquisition/evidence lifecycle until a
#   separate live-evidence readiness contract is reviewed.
# - The same sanity run produced duplicate startup acquisition-status publications. They were
#   detected and caused no duplicate provider subscription, but add avoidable lifecycle/audit noise
#   and should be reconciled at the acquisition owner rather than normalized by projections.
# - The mandatory acquisition actor still constructs historical machinery and advances an empty
#   coordinator every 100ms even when no historical-demand producer is composed.
# - maximum_plan_requests and maximum_total_observations are checked per independently compiled
#   demand, not as aggregate outstanding/session/run budgets across all consumers.
# - There is no explicit successful-request pacing interval; retry_backoff_ms is not IB pacing.
# - Provider errors are not classified by entitlement, pacing, unavailable range, farm/session,
#   permanent request defect, timeout, or adapter/local failure before retry policy is applied.
# - Some planning/capacity/deferred/shutdown rejections do not publish one typed terminal result to
#   the consumer; log-only rejection can leave demand lifecycle and audit incomplete.
# - Historical producers use one-shot startup publication without a receipt acknowledgement or
#   stable-demand reconciliation contract.
# - Native historical cancellation is a no-op at this boundary. A late response can be attributed
#   to a newer attempt or another active request because the callback exposes no request identity.
# - Sequential shutdown cancellation can dispatch pending work after stopping has begun.
# - Scheduling is priority then request identity, not FIFO, and has no aging/fairness contract.
# - A next request can be submitted before the prior batch/readiness outcome is published.
# - Live provider-subscription failure has no autonomous acquisition-owner retry; any FAILED
#   transition rejects this first run rather than being awaited as self-recovering.
# - No typed deadline currently bounds SUBSCRIBED to first matching bar/ACTIVE for this profile.
# - Nautilus RC3's pinned Rust ibapi 3.3.0 rejects IB's dashed UTC HistoricalDataEnd metadata, so
#   instrument-timezone transport is required until the dependency accepts both official forms.
# - Nautilus turns that native parse failure into an empty response; Markeitech then records an
#   accepted/completed zero-observation result before correctly degrading consumer readiness.
# - Two instrument-timezone calibration runs returned a repeatable 4/5 because the prior native
#   port submitted the inclusive `...:59.999999999` end at whole-second `...:59` instead of the
#   completed exclusive minute boundary. The corrected port is connected-accepted for one exact
#   five-bar ES recent-completed path; other selectors/windows remain unaccepted.
# The values below authorize one 60-observation request for the five-minute historical-only visual
# review: a nominal five hours before any real market/session gaps. They are not IB limits or
# accepted analytical-history policy; a short response or timeout must remain visible and must not
# trigger request splitting or an automatic second request.
[historical]
maximum_plan_requests = 1
maximum_observations_per_request = 60
maximum_total_observations = 60
maximum_outstanding_requests = 1
maximum_in_flight_requests = 1
timeout_seconds = 30
maximum_attempts = 1
retry_backoff_ms = 500
poll_interval_ms = 100

# SessionStateActor is the sole runtime owner of the selected canonical calendar. The dedicated
# catalog is loaded and validated atomically; consumers receive typed current transitions or
# immutable bounded projections and never instantiate mcal themselves. The separate historical
# planner resolves symbolic demand into exact UTC plans before acquisition executes it.
[sessions]
evaluation_interval_ms = 1000
projection_lookback_days = 120
projection_lookahead_days = 14
maximum_projection_days = 400
maximum_calendars_per_request = 8
calendar_catalog = "market-calendars.toml"
calendar_ids = ["cme_equity"]

[sessions.projection_retry]
response_timeout_ms = 5000
maximum_attempts = 3
retry_backoff_ms = 1000
maximum_elapsed_ms = 60000

[sessions.current_state_delivery]
policy_version = 1
response_timeout_ms = 5000
maximum_attempts = 3
retry_backoff_ms = 1000
maximum_elapsed_ms = 60000
maximum_buffered_transitions_per_calendar = 8
maximum_total_buffered_transitions = 32
boundary_delivery_grace_ms = 2000

[evidence_health]
evaluation_interval_ms = 1000
consumer_retry_interval_ms = 1000
provider_id = "IB"
profile_checkpoint_samples = 25

[[evidence_health.policies]]
feed_kind = "bars"
selector = "5-SECOND-LAST-EXTERNAL"
fresh_for_ms = 7000
stale_after_ms = 15000
unavailable_after_ms = 30000
adaptive = false
minimum_samples = 20
decay_factor = 0.95
fresh_stddev_multiplier = 2.0
stale_stddev_multiplier = 4.0
unavailable_stddev_multiplier = 8.0
min_fresh_ms = 5000
max_fresh_ms = 10000
min_stale_ms = 10000
max_stale_ms = 20000
min_unavailable_ms = 20000
max_unavailable_ms = 60000

# Disabled metric engines retain complete typed placeholder schemas because the current loader
# validates their structure even when composition omits their actors.
[watchlist]
enabled = true
consumer_retry_interval_ms = 1000

[[watchlist.members]]
instrument_id = "ESU6.CME"
calendar_id = "cme_equity"
owner_ids = ["config:system"]
capabilities = ["watchlist_last"]
